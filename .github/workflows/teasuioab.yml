name: Deploy GoLogin Kiosk (Cloudflare Tunnel)

# This allows you to manually trigger the workflow from the Actions tab
on:
  workflow_dispatch:
    inputs:
      ghcr_owner:
        description: 'GitHub Username / GHCR Owner (e.g., tvkk0539)'
        required: true
        default: 'tvkk0539'

jobs:
  run-kiosk:
    runs-on: ubuntu-latest
    
    # Increase the timeout limit so you can use the browser for up to 6 hours for free!
    timeout-minutes: 360 
    
    steps:
      - name: 🛡️ Establish Cloudflare WARP Ghost Tunnel
        uses: fscarmen/warp-on-actions@v1.2
        with:
          stack: ipv4 # Enables IPv4 routing only to prevent IPv6 drops

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🌐 Boot GoLogin Kiosk & Cloudflare Proxy
        run: |
          echo "Starting the GoLogin Kiosk, Ghost Monitor, and Cloudflare Tunnel inside Docker..."
          
          # We override the entrypoint to run our Cloudflare setup first, then launch the Kiosk orchestrator
          docker run --rm --network host --entrypoint /bin/bash ghcr.io/${{ github.event.inputs.ghcr_owner }}/aio-mr-gologin-kiosk:latest -c "
            echo 'Installing Cloudflare tunnel inside container...' &&
            apt-get update -qq && apt-get install -qq -y curl > /dev/null 2>&1 &&
            curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb &&
            dpkg -i cloudflared.deb > /dev/null 2>&1 &&
            
            # Start the tunnel pointing to the noVNC port (6080)
            cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > cloudflared.log 2>&1 &
            
            (
              echo 'Waiting for Cloudflare Tunnel to boot...'
              while ! grep -q 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log; do
                sleep 5
              done
              echo 'Tunnel is online! Extracting URL...'
              CF_URL=\$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log | head -n1)
              
              if [ -n \"\$CF_URL\" ] && [ -n \"${{ secrets.DISCORD_WEBHOOK_URL }}\" ]; then
                # Notice we append /vnc.html so it instantly loads the visual interface!
                curl -s -H \"Content-Type: application/json\" -X POST -d \"{\\\"content\\\": \\\"🌐 **GoLogin Web Kiosk is Online!**\n🔗 Click here to access your remote browser: \$CF_URL/vnc.html\\\"}\" ${{ secrets.DISCORD_WEBHOOK_URL }}
              fi
            ) &
            
            echo 'Starting the Kiosk Orchestrator...'
            /start.sh
          "
