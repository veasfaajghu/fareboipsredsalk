name: Deploy GoLogin Kiosk (Cloudflare Tunnel)

# This allows you to manually trigger the workflow from the Actions tab
on:
  workflow_dispatch:
    inputs:
      ghcr_owner:
        description: 'GitHub Username / GHCR Owner (e.g., tvkk0539)'
        required: true
        default: 'tvkk0539'

jobs:
  run-kiosk:
    runs-on: ubuntu-latest
    
    # Increase the timeout limit so you can use the browser for up to 6 hours for free!
    timeout-minutes: 360 
    
    steps:
      - name: 🛡️ Establish Cloudflare WARP Ghost Tunnel
        uses: fscarmen/warp-on-actions@v1.2
        with:
          stack: ipv4 # Enables IPv4 routing only to prevent IPv6 drops

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🌐 Boot GoLogin Kiosk & Cloudflare Proxy
        run: |
          echo "Starting the GoLogin Kiosk, Ghost Monitor, and Cloudflare Tunnel inside Docker..."
          
          # We override the entrypoint to run our Cloudflare setup first, then launch the Kiosk orchestrator
          docker run --rm --network host --privileged --shm-size=4gb --security-opt seccomp=unconfined --entrypoint /bin/bash ghcr.io/${{ github.event.inputs.ghcr_owner }}/aio-mr-gologin-kiosk:latest -c "
            echo 'Establishing Cloudflare tunnel...' &&
            cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
            echo 'Waiting for Cloudflare Ghost Tunnel to establish...' &&
            while ! grep -q 'https://.*trycloudflare.com' /tmp/cloudflared.log; do sleep 1; done &&
            TUNNEL_URL=\$(grep -o 'https://.*trycloudflare.com' /tmp/cloudflared.log | head -n 1) &&
            echo '===================================================' &&
            echo '  [SUCCESS] GHOST TUNNEL ESTABLISHED!  ' &&
            echo \"  🔗 URL: \$TUNNEL_URL\" &&
            echo '===================================================' &&
            if [ -n \"\$TUNNEL_URL\" ] && [ -n \"${{ secrets.DISCORD_WEBHOOK_URL }}\" ]; then
              curl -s -H \"Content-Type: application/json\" -X POST -d \"{\\\"content\\\": \\\"🌐 **GoLogin Web Kiosk is Online!**\n🔗 Click here to access your remote browser: \$TUNNEL_URL/vnc.html\\\"}\" ${{ secrets.DISCORD_WEBHOOK_URL }}
            fi &&
            /start.sh
          "
