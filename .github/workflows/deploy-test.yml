name: Deploy NA Test (Mini App Mode)

# This allows you to manually trigger the workflow from the Actions tab
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Optional: Increase the timeout limit if you want to run exactly 6 hours
    timeout-minutes: 280 
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      # 👻 THE GHOST TUNNEL: This is the massive intelligence trick.
      # It intercepts all outbound traffic from the runner and routes it through Cloudflare.
      - name: 🛡️ Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.2
        with:
          stack: dual # Enables both IPv4 and IPv6 routing

      # 🔑 Authenticate to pull your Docker Image
      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Or use a PAT if pulling a private image

      # 🚀 Install Cloudflared and Run BOTH engines
      - name: 🌐 Boot NA Test & Mini App Proxy
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://127.0.0.1:5001 > cloudflared.log 2>&1 &
          
          # 🕒 Background Watcher: Wait for Uvicorn to boot before sending webhook
          (
            echo "Waiting for Uvicorn to bind to port 5001..."
            while ! curl -s http://127.0.0.1:5001 > /dev/null; do sleep 5; done
            echo "Uvicorn is online! Extracting URL..."
            CF_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log | head -n1 || true)
            if [ -n "$CF_URL" ] && [ -n "${{ secrets.DOCKER_IMAGE_WEB_URL }}" ]; then
              curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"📱 **Neon Archive Mini App is Online!**\n🔗 Link: $CF_URL\"}" ${{ secrets.DISCORD_WEBHOOK_URL }}
            fi
          ) &
          
          echo "Starting the Telegram Bot & Web UI inside the Cloudflare WARP Ghost Tunnel..."
          docker run --rm --network host --entrypoint /bin/bash ${{ secrets.DOCKER_IMAGE_URL }} -c "python3 -m telegram & python3 -m web"
