name: Standalone Android Spoofer

on:
  workflow_dispatch:
    inputs:
      ghcr_username:
        description: 'Your Main GitHub Username (e.g. tvkk0539)'
        required: true
        type: string
      image_tag:
        description: 'Which image do you want to run?'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - playstore
          - unrooted
          - unrooted-playstore

jobs:
  run-android-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    
    steps:
      - name: 🚀 Boot Pre-Built Spoofed Emulator & Web Streamer
        run: |
          echo "Creating virtual network..."
          docker network create droid-net
          
          echo "Booting Custom Headless Android Emulator with Spoofing..."
          # REPLACE 'YOUR_MAIN_ACCOUNT_USERNAME' WITH THE USERNAME WHERE THE IMAGE WAS BUILT
          # Optional: Route all traffic through a SOCKS5 proxy and spoof GPS to proxy IP
          # Example: -e PROXY_URL="socks5://user:password@198.51.100.25:1080"
          docker run -d --privileged --name android-core --network droid-net \
            -e ENABLE_GHOST_MODE=true \
            -e PROXY_URL="" \
            ghcr.io/${{ github.event.inputs.ghcr_username }}/neon-spoofer:${{ github.event.inputs.image_tag }}
            
          echo "Booting Web Touch Streamer (scrcpy-web)..."
          docker run -d --name web-streamer --network droid-net \
            -e ADB_SERVER_ADDR=android-core \
            -e ADB_SERVER_PORT=5555 \
            -p 8000:8000 \
            emptysuns/scrcpy-web:v0.1
            
          echo "Automating ADB Bridge connection..."
          docker exec -d web-streamer /bin/sh -c "while true; do adb connect android-core:5555; sleep 10; done"

      - name: 🌐 Establish Cloudflare Tunnel
        run: |
          echo "Installing Cloudflared..."
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          echo "Starting Tunnel to Web Streamer (Port 8000)..."
          cloudflared tunnel --protocol http2 --url http://127.0.0.1:8000 > cloudflared.log 2>&1 &
          
          echo "Waiting for URL..."
          while ! grep -q 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log; do
            sleep 5
          done
          
          CF_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log | head -n1)
          echo "====================================================="
          echo "📱 SPOOFED ANDROID STREAM URL: $CF_URL"
          echo "====================================================="
          
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"📱 Spoofed Android Sandbox Online!**\n🔗 Link: $CF_URL\n👻 **Mode: ${{ github.event.inputs.image_tag }}\"}" ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi
          
          sleep 6h
