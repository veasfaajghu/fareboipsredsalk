name: AdsPower Stealth Kiosk Deploy

on:
  workflow_dispatch:
    inputs:
      ghcr_owner:
        description: 'Target Repository Owner'
        required: true
        default: 'tvkk0539'

jobs:
  run-stealth-kiosk:
    runs-on: ubuntu-latest
    
    # Increase the timeout limit so you can use the browser for up to 6 hours for free!
    timeout-minutes: 360 
    
    steps:
      - name: 🛡️ Establish Secure Network Bridge (WARP)
        uses: fscarmen/warp-on-actions@v1.2
        with:
          stack: ipv4 # Enables IPv4 routing only to prevent IPv6 drops

      - name: 🔐 Authenticate Artifact Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🌐 Boot AdsPower Optimization Matrix
        run: |
          echo "Starting AdsPower Kiosk..."
          
          docker run --rm --network host --privileged --shm-size=4gb --security-opt seccomp=unconfined --entrypoint /bin/bash ghcr.io/${{ github.event.inputs.ghcr_owner }}/aio-mr-adspower-kiosk:latest -c "
            echo 'Establishing secondary network bridge...' &&
            cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &
            echo 'Waiting for bridge to establish...' &&
            while ! grep -q 'https://.*trycloudflare.com' /tmp/cloudflared.log; do sleep 1; done &&
            TUNNEL_URL=\$(grep -o 'https://.*trycloudflare.com' /tmp/cloudflared.log | head -n 1) &&
            echo '===================================================' &&
            echo '  [SUCCESS] NETWORK BRIDGE ESTABLISHED!  ' &&
            echo \"  🔗 Link: \$TUNNEL_URL\" &&
            echo '===================================================' &&
            if [ -n \"\$TUNNEL_URL\" ] && [ -n \"${{ secrets.DISCORD_WEBHOOK_URL }}\" ]; then
              curl -s -H \"Content-Type: application/json\" -X POST -d \"{\\\"content\\\": \\\"🌐 **AdsPower Stealth Kiosk is Online!**\n🔗 Secure Access Link: \$TUNNEL_URL/vnc.html\\\"}\" ${{ secrets.DISCORD_WEBHOOK_URL }}
            fi &&
            /start.sh
          "
