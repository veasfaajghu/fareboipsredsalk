name: 🌌 Deploy Full Stack (Dual Worlds)

on:
  workflow_dispatch:

jobs:
  deploy-full-stack:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Establish Cloudflare WARP Ghost Tunnel
        uses: fscarmen/warp-on-actions@v1.2
        with:
          stack: ipv4 # Enables IPv4 routing only to prevent IPv6 drops

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Pull Latest Docker Image
        run: docker pull ${{ secrets.DOCKER_IMAGE_WEB_URL }}

      - name: 🌐 Boot Full Stack (Telegram & Web UI)
        run: |
          echo "Setting up shared storage volumes for the Dual Engine..."
          mkdir -p /tmp/neon-data /tmp/neon-images /tmp/neon-wrapper /tmp/rclone_config
          
          echo "Starting the Full Stack Architecture..."
          
          # Container 1: The Web UI (Port 5001)
          docker run -d --rm --network host --privileged --name web_ui \
            -e VAULT_DB_PATH=/data/neon_dump_vault.sqlite \
            -e USER_MATRIX_DB_PATH=/data/neon_users.sqlite \
            -v /tmp/neon-data:/data \
            -v /tmp/rclone_config:/config \
            -v /tmp/neon-images:/usr/src/app/web/static/media_images \
            --entrypoint /bin/bash ${{ secrets.DOCKER_IMAGE_WEB_URL }} -c "
            apt-get update -qq && apt-get install -qq -y curl > /dev/null 2>&1 &&
            curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb &&
            dpkg -i cloudflared.deb > /dev/null 2>&1 &&
            cloudflared tunnel --protocol http2 --url http://127.0.0.1:5001 > cloudflared.log 2>&1 &
            
            (
              echo 'Waiting for Web UI and Tunnel...'
              while ! curl -s http://127.0.0.1:5001 > /dev/null || ! grep -q 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log; do
                sleep 5
              done
              CF_URL=\$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log | head -n1)
              if [ -n \"\$CF_URL\" ] && [ -n \"${{ secrets.DISCORD_WEBHOOK_URL }}\" ]; then
                curl -s -H \"Content-Type: application/json\" -X POST -d \"{\\\"content\\\": \\\"🌌 **Full Stack - Web UI is Online!**\n🔗 Link: \$CF_URL\\\"}\" ${{ secrets.DISCORD_WEBHOOK_URL }}
              fi
            ) &
            
            python3 -m web
          "

          # Container 2: The Telegram Bot & Stream Proxy (Port 5000)
          # We run this in the foreground so the GitHub Action stays alive!
          docker run --rm --network host --privileged --name telegram_bot \
            -e VAULT_DB_PATH=/data/neon_dump_vault.sqlite \
            -e USER_MATRIX_DB_PATH=/data/neon_users.sqlite \
            -v /tmp/neon-data:/data \
            -v /tmp/rclone_config:/config \
            -v /tmp/neon-images:/usr/src/app/web/static/media_images \
            -v /tmp/neon-wrapper:/usr/local/wrapper/rootfs/data \
            --entrypoint /bin/bash ${{ secrets.DOCKER_IMAGE_WEB_URL }} -c "
            apt-get update -qq && apt-get install -qq -y curl > /dev/null 2>&1 &&
            curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb &&
            dpkg -i cloudflared.deb > /dev/null 2>&1 &&
            cloudflared tunnel --protocol http2 --url http://127.0.0.1:5000 > cloudflared.log 2>&1 &
            
            (
              echo 'Waiting for Telegram Stream Proxy and Tunnel...'
              while ! curl -s http://127.0.0.1:5000 > /dev/null || ! grep -q 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log; do
                sleep 5
              done
              CF_URL=\$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log | head -n1)
              if [ -n \"\$CF_URL\" ] && [ -n \"${{ secrets.DISCORD_WEBHOOK_URL }}\" ]; then
                curl -s -H \"Content-Type: application/json\" -X POST -d \"{\\\"content\\\": \\\"🌌 **Full Stack - Stream Proxy is Online!**\n🔗 Link: \$CF_URL\\\"}\" ${{ secrets.DISCORD_WEBHOOK_URL }}
              fi
            ) &
            
            python3 -m telegram
          "
