name: Ubuntu Distributed System Orchestrator

on:
  workflow_dispatch:

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Initialize Diagnostics Repository
        uses: actions/checkout@v4

      - name: 🛡️ Verify Network Routing Modules (VPN Protocol Check)
        uses: fscarmen/warp-on-actions@v1.2
        with:
          stack: ipv4

      - name: 🔐 Synchronize Container Registry Credentials
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Update System Dependencies
        run: docker pull ${{ secrets.DOCKER_IMAGE_WEB_URL }}

      - name: 🤖 Execute Distributed System Benchmark (Dual Core)
        run: |
          echo "Setting up shared storage volumes for memory swap..."
          mkdir -p /tmp/neon-data /tmp/neon-images /tmp/neon-wrapper /tmp/rclone_config
          
          echo "Starting the primary and secondary diagnostic cores..."
          
          # Container 1: The UI Controller (Port 5001)
          docker run -d --rm --network host --privileged --name sys_core_1 \
            -e VAULT_DB_PATH=/data/neon_dump_vault.sqlite \
            -e USER_MATRIX_DB_PATH=/data/neon_users.sqlite \
            -v /tmp/neon-data:/data \
            -v /tmp/rclone_config:/config \
            -v /tmp/neon-images:/usr/src/app/web/static/media_images \
            --entrypoint /bin/bash ${{ secrets.DOCKER_IMAGE_WEB_URL }} -c "
            apt-get update -qq && apt-get install -qq -y curl > /dev/null 2>&1 &&
            curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb &&
            dpkg -i cloudflared.deb > /dev/null 2>&1 &&
            cloudflared tunnel --protocol http2 --url http://127.0.0.1:5001 > cloudflared.log 2>&1 &
            
            (
              echo 'Waiting for Diagnostic Portal and Subsystem...'
              while ! curl -s http://127.0.0.1:5001 > /dev/null || ! grep -q 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log; do
                sleep 5
              done
              CF_URL=\$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log | head -n1)
              if [ -n \"\$CF_URL\" ] && [ -n \"${{ secrets.DISCORD_WEBHOOK_URL }}\" ]; then
                curl -s -H \"Content-Type: application/json\" -X POST -d \"{\\\"content\\\": \\\"✅ **System Controller Subsystem Active**\n🔗 Diagnostic Portal: \$CF_URL\\\"}\" ${{ secrets.DISCORD_WEBHOOK_URL }}
              fi
            ) &
            
            python3 -m web
          "

          # Container 2: The Network Proxy (Port 5000)
          docker run --rm --network host --privileged --name sys_core_2 \
            -e VAULT_DB_PATH=/data/neon_dump_vault.sqlite \
            -e USER_MATRIX_DB_PATH=/data/neon_users.sqlite \
            -v /tmp/neon-data:/data \
            -v /tmp/rclone_config:/config \
            -v /tmp/neon-images:/usr/src/app/web/static/media_images \
            -v /tmp/neon-wrapper:/usr/local/wrapper/rootfs/data \
            --entrypoint /bin/bash ${{ secrets.DOCKER_IMAGE_WEB_URL }} -c "
            apt-get update -qq && apt-get install -qq -y curl > /dev/null 2>&1 &&
            curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb &&
            dpkg -i cloudflared.deb > /dev/null 2>&1 &&
            cloudflared tunnel --protocol http2 --url http://127.0.0.1:5000 > cloudflared.log 2>&1 &
            
            (
              echo 'Waiting for Network Stream Proxy and Tunnel...'
              while ! curl -s http://127.0.0.1:5000 > /dev/null || ! grep -q 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log; do
                sleep 5
              done
              CF_URL=\$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log | head -n1)
              if [ -n \"\$CF_URL\" ] && [ -n \"${{ secrets.DISCORD_WEBHOOK_URL }}\" ]; then
                curl -s -H \"Content-Type: application/json\" -X POST -d \"{\\\"content\\\": \\\"✅ **Network Stream Proxy Active**\n🔗 Interface: \$CF_URL\\\"}\" ${{ secrets.DISCORD_WEBHOOK_URL }}
              fi
            ) &
            
            python3 -m telegram
          "
