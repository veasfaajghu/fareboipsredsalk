name: Test Neon Droid (Sandbox)

on:
  workflow_dispatch:

jobs:
  run-android-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    
    steps:
      - name: 🚀 Boot Android Emulator & Web Streamer
        run: |
          echo "Creating virtual network..."
          docker network create droid-net
          
          echo "Booting Headless Android Emulator (Warning: No KVM on GitHub Actions, boot will be slow)..."
          docker run -d --privileged --name android-core --network droid-net \
            -e DEVICE_PROFILE=Pixel_4 \
            -e ANDROID_VERSION=13.0 \
            halimqarroum/docker-android:api-33-playstore
            
          echo "Booting Web Touch Streamer (scrcpy-web)..."
          docker run -d --name web-streamer --network droid-net \
            -e ADB_SERVER_ADDR=android-core \
            -e ADB_SERVER_PORT=5555 \
            -p 8000:8000 \
            emptysuns/scrcpy-web:latest

      - name: 🌐 Establish Cloudflare Tunnel
        run: |
          echo "Installing Cloudflared..."
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          echo "Starting Tunnel to Web Streamer (Port 8000)..."
          cloudflared tunnel --protocol http2 --url http://127.0.0.1:8000 > cloudflared.log 2>&1 &
          
          echo "Waiting for URL..."
          while ! grep -q 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log; do
            sleep 5
          done
          
          CF_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' cloudflared.log | head -n1)
          echo "====================================================="
          echo "📱 ANDROID STREAM URL: $CF_URL"
          echo "====================================================="
          echo "Note: The web URL will open immediately, but the Android screen may be black for 5-10 minutes while it boots because GitHub Actions lacks KVM hardware acceleration."
          
          # Optional: Send to Discord if secret exists
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"📱 **Android Sandbox Online!**\n🔗 Link: $CF_URL\n*(Please wait 5-10 minutes for the OS to boot without KVM)*\"}" ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi
          
          # Keep the action alive
          sleep 6h
