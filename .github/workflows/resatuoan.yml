name: Public FreeNet ISP Bypass Deployer

on:
  workflow_dispatch:
    inputs:
      node_name:
        description: 'Name of this FreeNet node'
        required: true
        default: 'FreeNet-Matrix-Node'

jobs:
  deploy-freenet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Advanced Routing Matrix
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IMAGE_URL: ${{ secrets.FREENET_IMAGE_URL }}
          BUG_HOST: ${{ secrets.BUG_HOST }}
          EDGE_WORKER_DOMAIN: ${{ secrets.EDGE_WORKER_DOMAIN }}
        run: |
          if [ -z "$IMAGE_URL" ]; then
            echo "🚨 Error: FREENET_IMAGE_URL secret is missing! Please add your Docker image URL to GitHub Secrets."
            exit 1
          fi
          
          echo "🚀 Pulling and starting FreeNet image: $IMAGE_URL"
          
          # The Docker container handles all SNI spoofing and Cloudflare tunneling internally
          docker run -d --name freenet-matrix -p 8080:8080 -p 8082:8082 \
            -e NO_WARP=false \
            -e TG_BOT_TOKEN="${TG_BOT_TOKEN}" \
            -e TG_CHAT_ID="${TG_CHAT_ID}" \
            -e DISCORD_WEBHOOK_URL="${DISCORD_WEBHOOK_URL}" \
            -e BUG_HOST="${BUG_HOST}" \
            -e EDGE_WORKER_DOMAIN="${EDGE_WORKER_DOMAIN}" \
            "${IMAGE_URL}"
            
      - name: Maintain Active Cache Matrix (Keep-Alive)
        run: |
          # Keep the runner alive so the proxy stays online
          docker logs -f freenet-matrix
